    <!-- lane 1: SMTP -->
    <text x="300" y="112" font-size="15" font-weight="700" fill="#c4321f">SMTP</text>
    <text x="350" y="112" class="mono" font-size="13" fill="#6b6b70">ports 25 · 465 · 587</text>
    <path d="M270 128H508" stroke="#c4321f" stroke-width="3" stroke-dasharray="9 7">
      <animate attributeName="stroke-dashoffset" values="0;-32" dur="2.5s" repeatCount="indefinite"/>
    </path>

    <!-- lane 2: HTTPS -->
    <text x="300" y="242" font-size="15" font-weight="700" fill="#1f7a45">HTTPS</text>
    <text x="358" y="242" class="mono" font-size="13" fill="#6b6b70">port 443</text>
    <path d="M270 258H690" stroke="#1f7a45" stroke-width="3.5"/>
    <path d="M690 258C730 258 730 214 770 214" fill="none" stroke="#1f7a45" stroke-width="3.5" marker-end="url(#arrow-g)"/>
    <path d="M690 258C730 258 730 302 770 302" fill="none" stroke="#1f7a45" stroke-width="3.5" marker-end="url(#arrow-g)"/>
    <path d="M950 214C990 214 990 258 1030 258M950 302C990 302 990 258 1030 258" fill="none" stroke="#b9b9b2" stroke-width="2.5"/>

    <!-- envelopes on the open route: 10s per trip, one every 5s; drawn under the tiles so they pass behind them -->
    <g opacity="0">
      <use href="#envelope"/>
      <animateMotion dur="10s" repeatCount="indefinite" keyTimes="0;.6;1" keyPoints="0;1;1" calcMode="linear"><mpath href="#route-sendgrid"/></animateMotion>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;.04;.56;.6;1" values="0;1;1;0;0"/>
    </g>
    <g opacity="0">
      <use href="#envelope"/>
      <animateMotion dur="10s" begin="5s" repeatCount="indefinite" keyTimes="0;.6;1" keyPoints="0;1;1" calcMode="linear"><mpath href="#route-brevo"/></animateMotion>
      <animate attributeName="opacity" dur="10s" begin="5s" repeatCount="indefinite" keyTimes="0;.04;.56;.6;1" values="0;1;1;0;0"/>
    </g>

    <!-- envelope bouncing off the SMTP wall: 5s cycle -->
    <g opacity="0">
      <use href="#envelope"/>
      <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
        keyTimes="0;.45;.52;.6;1" values="290 128;488 128;462 128;470 128;470 128"/>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;.06;.5;.7;1" values="0;1;1;0;0"/>
    </g>

    <!-- firewall -->
    <rect x="520" y="30" width="56" height="196" rx="4" fill="url(#bricks)" stroke="#c9bfb0" stroke-width="1.5"/>
    <rect x="520" y="290" width="56" height="60" rx="4" fill="url(#bricks)" stroke="#c9bfb0" stroke-width="1.5"/>
    <text x="548" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#6b6b70">Host firewall</text>

    <!-- lock + impact pulse -->
    <g transform="translate(548,128)">
      <circle r="26" fill="none" stroke="#c4321f" stroke-width="2" opacity="0">
        <animate attributeName="r" dur="5s" repeatCount="indefinite" keyTimes="0;.45;.7;1" values="26;26;46;46"/>
        <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;.45;.46;.7;1" values="0;0;.7;0;0"/>
      </circle>
      <circle r="26" fill="#fff" stroke="#c4321f" stroke-width="2.5"/>
      <g>
        <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
          keyTimes="0;.45;.48;.51;.54;.57;1" values="0 0;0 0;-3 0;3 0;-2 0;0 0;0 0"/>
        <path d="M-8 -3V-9a8 8 0 0 1 16 0V-3" fill="none" stroke="#c4321f" stroke-width="3" stroke-linecap="round"/>
        <rect x="-12" y="-3" width="24" height="17" rx="3" fill="#c4321f"/>
      </g>
    </g>
    <g transform="translate(600,98)">
      <rect width="250" height="60" rx="10" fill="#fbeeeb"/>
      <text x="16" y="25" font-size="15" font-weight="700" fill="#c4321f">Blocked for security</text>
      <text x="16" y="46" font-size="13" fill="#7a2214">Hosts close these ports to stop spam</text>
    </g>

    <!-- open gate + pulse as each envelope passes (~2s into its trip) -->
    <g transform="translate(548,258)">
      <circle r="22" fill="none" stroke="#1f7a45" stroke-width="2" opacity="0">
        <animate attributeName="r" dur="5s" begin="2s" repeatCount="indefinite" keyTimes="0;.25;1" values="22;40;40"/>
        <animate attributeName="opacity" dur="5s" begin="2s" repeatCount="indefinite" keyTimes="0;.01;.25;1" values="0;.7;0;0"/>
      </circle>
      <circle r="22" fill="#fff" stroke="#1f7a45" stroke-width="2.5"/>
      <path d="M-8 0l5 5 11-11" fill="none" stroke="#1f7a45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- providers -->
    <g filter="url(#shadow)">
      <rect x="780" y="186" width="170" height="56" rx="12" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/>
      <rect x="780" y="274" width="170" height="56" rx="12" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/>
    </g>
