<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Cloud hosts block SMTP ports for security. Laravel HTTP Mailer sends mail over HTTPS port 443 through SendGrid or Brevo instead. You don't change your email code.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <defs>
    <pattern id="bricks" width="40" height="24" patternUnits="userSpaceOnUse">
      <rect width="40" height="24" fill="#e9e4dc"/>
      <path d="M0 0H40M0 12H40M0 24H40M20 0V12M0 12V24M40 12V24" stroke="#cfc6b8" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1b1f" flood-opacity=".08"/>
    </filter>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1f7a45"/>
    </marker>
    <g id="envelope">
      <rect x="-15" y="-11" width="30" height="22" rx="3" fill="#fff" stroke="#16161a" stroke-width="2"/>
      <path d="M-15 -8L0 3L15 -8" fill="none" stroke="#16161a" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <path id="route-sendgrid" d="M270 258H690C730 258 730 214 770 214H950C990 214 990 258 1030 258H1062"/>
    <path id="route-brevo" d="M270 258H690C730 258 730 302 770 302H950C990 302 990 258 1030 258H1062"/>
  </defs>

  <rect width="1280" height="640" fill="#f4f4f1"/>

  <!-- headline -->
  <text x="64" y="92" font-size="42" font-weight="700" fill="#16161a" letter-spacing="-1">Cloud hosts block SMTP ports for security.</text>
  <text x="64" y="134" font-size="21" fill="#6b6b70">Send over <tspan font-weight="700" fill="#16161a">HTTPS port 443</tspan> instead. <tspan font-weight="700" fill="#1f7a45">Your email code doesn't change.</tspan></text>

