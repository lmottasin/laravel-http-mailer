    <g filter="url(#shadow)"><rect x="1036" y="222" width="80" height="72" rx="14" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/></g>
    <rect x="1036" y="222" width="80" height="72" rx="14" fill="none" stroke="#1f7a45" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" dur="5s" begin="6s" repeatCount="indefinite" keyTimes="0;.03;.35;1" values="0;1;0;0"/>
    </rect>
    <g transform="translate(1056,236)" fill="none" stroke="#16161a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="4" width="40" height="28" rx="4"/><path d="M0 8l20 13 20-13"/>
    </g>
    <text x="1076" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#1f7a45">delivered</text>
  </g>

  <!-- footer -->
  <rect x="64" y="572" width="472" height="40" rx="8" fill="#fff" stroke="#dcdcd6"/>
  <text x="80" y="598" class="mono" font-size="15" fill="#16161a"><tspan fill="#6b6b70">$ </tspan>composer require lmottasin/laravel-http-mailer</text>
