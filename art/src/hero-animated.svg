<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Cloud hosts block SMTP ports for security. Laravel HTTP Mailer sends mail over HTTPS port 443 through SendGrid or Brevo instead. You don't change your email code.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <defs>
    <pattern id="bricks" width="40" height="24" patternUnits="userSpaceOnUse">
      <rect width="40" height="24" fill="#e9e4dc"/>
      <path d="M0 0H40M0 12H40M0 24H40M20 0V12M0 12V24M40 12V24" stroke="#cfc6b8" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1b1f" flood-opacity=".08"/>
    </filter>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1f7a45"/>
    </marker>
    <g id="envelope">
      <rect x="-15" y="-11" width="30" height="22" rx="3" fill="#fff" stroke="#16161a" stroke-width="2"/>
      <path d="M-15 -8L0 3L15 -8" fill="none" stroke="#16161a" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <path id="route-sendgrid" d="M270 258H690C730 258 730 214 770 214H950C990 214 990 258 1030 258H1062"/>
    <path id="route-brevo" d="M270 258H690C730 258 730 302 770 302H950C990 302 990 258 1030 258H1062"/>
  </defs>

  <rect width="1280" height="640" fill="#f4f4f1"/>

  <!-- headline -->
  <text x="64" y="92" font-size="42" font-weight="700" fill="#16161a" letter-spacing="-1">Cloud hosts block SMTP ports for security.</text>
  <text x="64" y="134" font-size="21" fill="#6b6b70">Send over <tspan font-weight="700" fill="#16161a">HTTPS port 443</tspan> instead. <tspan font-weight="700" fill="#1f7a45">Your email code doesn't change.</tspan></text>

  <g transform="translate(64,176)">
    <!-- server -->
    <g filter="url(#shadow)"><rect x="40" y="56" width="230" height="250" rx="16" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/></g>
    <g transform="translate(62,76)">{{icon:laravel:ff2d20:26}}</g>
    <text x="98" y="96" font-size="17" font-weight="700" fill="#16161a">Your Laravel app</text>
    <rect x="62" y="124" width="186" height="42" rx="8" fill="#f6f6f3" stroke="#e2e2dc"/>
    <rect x="62" y="176" width="186" height="42" rx="8" fill="#f6f6f3" stroke="#e2e2dc"/>
    <rect x="62" y="228" width="186" height="42" rx="8" fill="#f6f6f3" stroke="#e2e2dc"/>
    <circle cx="80" cy="145" r="5" fill="#22a05a"><animate attributeName="opacity" values="1;.35;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="197" r="5" fill="#22a05a"><animate attributeName="opacity" values="1;.35;1" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="249" r="5" fill="#22a05a"><animate attributeName="opacity" values="1;.35;1" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <path d="M100 145H180M100 197H200M100 249H170" stroke="#d6d6d0" stroke-width="5" stroke-linecap="round"/>
    <text x="155" y="340" text-anchor="middle" font-size="13" fill="#6b6b70">hosted on</text>
    <g transform="translate(78,350)">{{icon:amazonwebservices:232f3e:26}}</g>
    <g transform="translate(118,352)">{{icon:digitalocean:0080ff:20}}</g>
    <g transform="translate(152,352)">{{icon:googlecloud:4285f4:20}}</g>
    <g transform="translate(186,352)">{{icon:hetzner:d50c2d:20}}</g>

    <!-- lane 1: SMTP -->
    <text x="300" y="112" font-size="15" font-weight="700" fill="#c4321f">SMTP</text>
    <text x="350" y="112" class="mono" font-size="13" fill="#6b6b70">ports 25 · 465 · 587</text>
    <path d="M270 128H508" stroke="#c4321f" stroke-width="3" stroke-dasharray="9 7">
      <animate attributeName="stroke-dashoffset" values="0;-32" dur="2.5s" repeatCount="indefinite"/>
    </path>

    <!-- lane 2: HTTPS -->
    <text x="300" y="242" font-size="15" font-weight="700" fill="#1f7a45">HTTPS</text>
    <text x="358" y="242" class="mono" font-size="13" fill="#6b6b70">port 443</text>
    <path d="M270 258H690" stroke="#1f7a45" stroke-width="3.5"/>
    <path d="M690 258C730 258 730 214 770 214" fill="none" stroke="#1f7a45" stroke-width="3.5" marker-end="url(#arrow-g)"/>
    <path d="M690 258C730 258 730 302 770 302" fill="none" stroke="#1f7a45" stroke-width="3.5" marker-end="url(#arrow-g)"/>
    <path d="M950 214C990 214 990 258 1030 258M950 302C990 302 990 258 1030 258" fill="none" stroke="#b9b9b2" stroke-width="2.5"/>

    <!-- envelopes on the open route: 10s per trip, one every 5s; drawn under the tiles so they pass behind them -->
    <g opacity="0">
      <use href="#envelope"/>
      <animateMotion dur="10s" repeatCount="indefinite" keyTimes="0;.6;1" keyPoints="0;1;1" calcMode="linear"><mpath href="#route-sendgrid"/></animateMotion>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;.04;.56;.6;1" values="0;1;1;0;0"/>
    </g>
    <g opacity="0">
      <use href="#envelope"/>
      <animateMotion dur="10s" begin="5s" repeatCount="indefinite" keyTimes="0;.6;1" keyPoints="0;1;1" calcMode="linear"><mpath href="#route-brevo"/></animateMotion>
      <animate attributeName="opacity" dur="10s" begin="5s" repeatCount="indefinite" keyTimes="0;.04;.56;.6;1" values="0;1;1;0;0"/>
    </g>

    <!-- envelope bouncing off the SMTP wall: 5s cycle -->
    <g opacity="0">
      <use href="#envelope"/>
      <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
        keyTimes="0;.45;.52;.6;1" values="290 128;488 128;462 128;470 128;470 128"/>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;.06;.5;.7;1" values="0;1;1;0;0"/>
    </g>

    <!-- firewall -->
    <rect x="520" y="30" width="56" height="196" rx="4" fill="url(#bricks)" stroke="#c9bfb0" stroke-width="1.5"/>
    <rect x="520" y="290" width="56" height="60" rx="4" fill="url(#bricks)" stroke="#c9bfb0" stroke-width="1.5"/>
    <text x="548" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#6b6b70">Host firewall</text>

    <!-- lock + impact pulse -->
    <g transform="translate(548,128)">
      <circle r="26" fill="none" stroke="#c4321f" stroke-width="2" opacity="0">
        <animate attributeName="r" dur="5s" repeatCount="indefinite" keyTimes="0;.45;.7;1" values="26;26;46;46"/>
        <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;.45;.46;.7;1" values="0;0;.7;0;0"/>
      </circle>
      <circle r="26" fill="#fff" stroke="#c4321f" stroke-width="2.5"/>
      <g>
        <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
          keyTimes="0;.45;.48;.51;.54;.57;1" values="0 0;0 0;-3 0;3 0;-2 0;0 0;0 0"/>
        <path d="M-8 -3V-9a8 8 0 0 1 16 0V-3" fill="none" stroke="#c4321f" stroke-width="3" stroke-linecap="round"/>
        <rect x="-12" y="-3" width="24" height="17" rx="3" fill="#c4321f"/>
      </g>
    </g>
    <g transform="translate(600,98)">
      <rect width="250" height="60" rx="10" fill="#fbeeeb"/>
      <text x="16" y="25" font-size="15" font-weight="700" fill="#c4321f">Blocked for security</text>
      <text x="16" y="46" font-size="13" fill="#7a2214">Hosts close these ports to stop spam</text>
    </g>

    <!-- open gate + pulse as each envelope passes (~2s into its trip) -->
    <g transform="translate(548,258)">
      <circle r="22" fill="none" stroke="#1f7a45" stroke-width="2" opacity="0">
        <animate attributeName="r" dur="5s" begin="2s" repeatCount="indefinite" keyTimes="0;.25;1" values="22;40;40"/>
        <animate attributeName="opacity" dur="5s" begin="2s" repeatCount="indefinite" keyTimes="0;.01;.25;1" values="0;.7;0;0"/>
      </circle>
      <circle r="22" fill="#fff" stroke="#1f7a45" stroke-width="2.5"/>
      <path d="M-8 0l5 5 11-11" fill="none" stroke="#1f7a45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- providers -->
    <g filter="url(#shadow)">
      <rect x="780" y="186" width="170" height="56" rx="12" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/>
      <rect x="780" y="274" width="170" height="56" rx="12" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/>
    </g>
    <g transform="translate(798,202)">{{icon:sendgrid:1a82e2:24}}</g>
    <text x="834" y="221" font-size="17" font-weight="700" fill="#16161a">SendGrid</text>
    <g transform="translate(798,290)">{{icon:brevo:0b996e:24}}</g>
    <text x="834" y="309" font-size="17" font-weight="700" fill="#16161a">Brevo</text>

    <!-- inbox + arrival glow (each envelope arrives 6s into its trip) -->
    <g filter="url(#shadow)"><rect x="1036" y="222" width="80" height="72" rx="14" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/></g>
    <rect x="1036" y="222" width="80" height="72" rx="14" fill="none" stroke="#1f7a45" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" dur="5s" begin="6s" repeatCount="indefinite" keyTimes="0;.03;.35;1" values="0;1;0;0"/>
    </rect>
    <g transform="translate(1056,236)" fill="none" stroke="#16161a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="4" width="40" height="28" rx="4"/><path d="M0 8l20 13 20-13"/>
    </g>
    <text x="1076" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#1f7a45">delivered</text>
  </g>

  <!-- footer -->
  <rect x="64" y="572" width="472" height="40" rx="8" fill="#fff" stroke="#dcdcd6"/>
  <text x="80" y="598" class="mono" font-size="15" fill="#16161a"><tspan fill="#6b6b70">$ </tspan>composer require lmottasin/laravel-http-mailer</text>
  <circle cx="944" cy="592" r="10" fill="#1f7a45"/>
  <path d="M939 592l3.5 3.5 6.5-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="962" y="598" font-size="16" font-weight="600" fill="#1f7a45">No changes to your email code</text>
</svg>
