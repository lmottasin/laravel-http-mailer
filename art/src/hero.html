<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="src/base.css">
<style>
  body { height: 640px; padding: 44px 64px 40px; display: flex; flex-direction: column; }
  .head h1 { font-size: 40px; line-height: 1.12; font-weight: 700; letter-spacing: -.025em; }
  .head p { margin-top: 10px; font-size: 20px; color: var(--muted); }
  .head p b { color: var(--ink); font-weight: 600; }
  .scene { flex: 1; display: flex; align-items: center; justify-content: center; }
  .scene svg { width: 100%; height: auto; }
  .foot { display: flex; justify-content: space-between; align-items: center; }
  .pill { font: 500 15px "JetBrains Mono"; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .pill span { color: var(--muted); }
  .nochange { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--green); }
  .nochange i { width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 12px; }
  svg text { font-family: Inter, sans-serif; }
  svg .mono { font-family: "JetBrains Mono", monospace; }
  .mobile { display: none; }

  @media (max-width: 700px) {
    body { height: auto; padding: 32px 24px; }
    .head h1 { font-size: 28px; }
    .head p { font-size: 16px; }
    .desktop { display: none; }
    .mobile { display: block; }
    .scene { margin: 18px 0; }
    .foot { flex-direction: column; align-items: flex-start; gap: 12px; }
    .pill { font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="head">
    <h1>Cloud hosts block SMTP ports for security.</h1>
    <p>Send over <b>HTTPS port 443</b> instead. <b style="color:var(--green)">Your email code doesn't change.</b></p>
  </div>

  <div class="scene">
    <!-- ================= DESKTOP ================= -->
    <svg class="desktop" viewBox="0 0 1152 380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="bricks" width="40" height="24" patternUnits="userSpaceOnUse">
          <rect width="40" height="24" fill="#e9e4dc"/>
          <path d="M0 0H40M0 12H40M0 24H40M20 0V12M0 12V24M40 12V24" stroke="#cfc6b8" stroke-width="1.5"/>
        </pattern>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1b1f" flood-opacity=".08"/>
        </filter>
        <marker id="arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0 0L10 5L0 10z" fill="#1f7a45"/>
        </marker>
      </defs>

      <!-- server -->
      <g filter="url(#shadow)">
        <rect x="40" y="56" width="230" height="250" rx="16" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/>
      </g>
      <g transform="translate(62,76)">{{icon:laravel:ff2d20:26}}</g>
      <text x="98" y="96" font-size="17" font-weight="700" fill="#16161a">Your Laravel app</text>
      <g>
        <rect x="62" y="124" width="186" height="42" rx="8" fill="#f6f6f3" stroke="#e2e2dc"/>
        <rect x="62" y="176" width="186" height="42" rx="8" fill="#f6f6f3" stroke="#e2e2dc"/>
        <rect x="62" y="228" width="186" height="42" rx="8" fill="#f6f6f3" stroke="#e2e2dc"/>
        <circle cx="80" cy="145" r="5" fill="#22a05a"/><circle cx="80" cy="197" r="5" fill="#22a05a"/><circle cx="80" cy="249" r="5" fill="#22a05a"/>
        <path d="M100 145H180M100 197H200M100 249H170" stroke="#d6d6d0" stroke-width="5" stroke-linecap="round"/>
      </g>
      <!-- hosts -->
      <text x="155" y="340" text-anchor="middle" font-size="13" fill="#6b6b70">hosted on</text>
      <g transform="translate(78,350)">{{icon:amazonwebservices:232f3e:26}}</g>
      <g transform="translate(118,352)">{{icon:digitalocean:0080ff:20}}</g>
      <g transform="translate(152,352)">{{icon:googlecloud:4285f4:20}}</g>
      <g transform="translate(186,352)">{{icon:hetzner:d50c2d:20}}</g>

      <!-- lane 1: SMTP blocked -->
      <text x="300" y="112" font-size="15" font-weight="700" fill="#c4321f">SMTP</text>
      <text x="348" y="112" class="mono" font-size="13" fill="#6b6b70">ports 25 · 465 · 587</text>
      <path d="M270 128H508" stroke="#c4321f" stroke-width="3" stroke-dasharray="9 7"/>

      <!-- lane 2: HTTPS open -->
      <text x="300" y="242" font-size="15" font-weight="700" fill="#1f7a45">HTTPS</text>
      <text x="356" y="242" class="mono" font-size="13" fill="#6b6b70">port 443</text>
      <path d="M270 258H690" stroke="#1f7a45" stroke-width="3.5"/>

      <!-- firewall wall with a gap for 443 -->
      <rect x="520" y="30" width="56" height="196" rx="4" fill="url(#bricks)" stroke="#c9bfb0" stroke-width="1.5"/>
      <rect x="520" y="290" width="56" height="60" rx="4" fill="url(#bricks)" stroke="#c9bfb0" stroke-width="1.5"/>
      <text x="548" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#6b6b70">Host firewall</text>

      <!-- lock on lane 1 -->
      <g transform="translate(548,128)">
        <circle r="26" fill="#fff" stroke="#c4321f" stroke-width="2.5"/>
        <path d="M-8 -3V-9a8 8 0 0 1 16 0V-3" fill="none" stroke="#c4321f" stroke-width="3" stroke-linecap="round"/>
        <rect x="-12" y="-3" width="24" height="17" rx="3" fill="#c4321f"/>
      </g>
      <!-- blocked note -->
      <g transform="translate(600,98)">
        <rect width="250" height="60" rx="10" fill="#fbeeeb"/>
        <text x="16" y="25" font-size="15" font-weight="700" fill="#c4321f">Blocked for security</text>
        <text x="16" y="46" font-size="13" fill="#7a2214">Hosts close these ports to stop spam</text>
      </g>

      <!-- open gate badge on lane 2 -->
      <g transform="translate(548,258)">
        <circle r="22" fill="#fff" stroke="#1f7a45" stroke-width="2.5"/>
        <path d="M-8 0l5 5 11-11" fill="none" stroke="#1f7a45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- branch to providers -->
      <path d="M690 258C730 258 730 214 770 214" fill="none" stroke="#1f7a45" stroke-width="3.5" marker-end="url(#arrow-g)"/>
      <path d="M690 258C730 258 730 302 770 302" fill="none" stroke="#1f7a45" stroke-width="3.5" marker-end="url(#arrow-g)"/>

      <g filter="url(#shadow)">
        <rect x="780" y="186" width="170" height="56" rx="12" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/>
        <rect x="780" y="274" width="170" height="56" rx="12" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/>
      </g>
      <g transform="translate(798,202)">{{icon:sendgrid:1a82e2:24}}</g>
      <text x="834" y="221" font-size="17" font-weight="700" fill="#16161a">SendGrid</text>
      <g transform="translate(798,290)">{{icon:brevo:0b996e:24}}</g>
      <text x="834" y="309" font-size="17" font-weight="700" fill="#16161a">Brevo</text>

      <!-- to inbox -->
      <path d="M950 214C990 214 990 258 1030 258M950 302C990 302 990 258 1030 258" fill="none" stroke="#b9b9b2" stroke-width="2.5"/>
      <g filter="url(#shadow)"><rect x="1036" y="222" width="80" height="72" rx="14" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/></g>
      <g transform="translate(1056,236)" fill="none" stroke="#16161a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="4" width="40" height="28" rx="4"/><path d="M0 8l20 13 20-13"/>
      </g>
      <text x="1076" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#1f7a45">delivered</text>
    </svg>

    <!-- ================= MOBILE ================= -->
    <svg class="mobile" viewBox="0 0 432 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="bricks-m" width="40" height="24" patternUnits="userSpaceOnUse">
          <rect width="40" height="24" fill="#e9e4dc"/>
          <path d="M0 0H40M0 12H40M0 24H40M20 0V12M0 12V24M40 12V24" stroke="#cfc6b8" stroke-width="1.5"/>
        </pattern>
        <filter id="shadow-m" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1b1f" flood-opacity=".08"/>
        </filter>
        <marker id="arrow-gm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0 0L10 5L0 10z" fill="#1f7a45"/>
        </marker>
      </defs>

      <!-- server -->
      <g filter="url(#shadow-m)"><rect x="66" y="8" width="300" height="96" rx="14" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/></g>
      <g transform="translate(86,26)">{{icon:laravel:ff2d20:22}}</g>
      <text x="118" y="43" font-size="16" font-weight="700" fill="#16161a">Your Laravel app</text>
      <circle cx="94" cy="76" r="4.5" fill="#22a05a"/>
      <path d="M110 76H200" stroke="#d6d6d0" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(226,64)">{{icon:amazonwebservices:232f3e:22}}</g>
      <g transform="translate(258,66)">{{icon:digitalocean:0080ff:17}}</g>
      <g transform="translate(286,66)">{{icon:googlecloud:4285f4:17}}</g>
      <g transform="translate(314,66)">{{icon:hetzner:d50c2d:17}}</g>

      <!-- lanes going down -->
      <path d="M126 104V222" stroke="#c4321f" stroke-width="3" stroke-dasharray="9 7"/>
      <text x="40" y="150" font-size="14" font-weight="700" fill="#c4321f">SMTP</text>
      <text x="40" y="168" class="mono" font-size="11" fill="#6b6b70">25·465·587</text>

      <path d="M306 104V372" stroke="#1f7a45" stroke-width="3.5"/>
      <text x="320" y="150" font-size="14" font-weight="700" fill="#1f7a45">HTTPS</text>
      <text x="320" y="168" class="mono" font-size="11" fill="#6b6b70">port 443</text>

      <!-- wall across, gap at the 443 lane -->
      <text x="216" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#6b6b70">Host firewall</text>
      <rect x="16" y="222" width="250" height="44" rx="4" fill="url(#bricks-m)" stroke="#c9bfb0" stroke-width="1.5"/>
      <rect x="346" y="222" width="70" height="44" rx="4" fill="url(#bricks-m)" stroke="#c9bfb0" stroke-width="1.5"/>

      <g transform="translate(126,244)">
        <circle r="22" fill="#fff" stroke="#c4321f" stroke-width="2.5"/>
        <path d="M-7 -3V-8a7 7 0 0 1 14 0V-3" fill="none" stroke="#c4321f" stroke-width="2.8" stroke-linecap="round"/>
        <rect x="-10" y="-3" width="20" height="14" rx="3" fill="#c4321f"/>
      </g>
      <g transform="translate(306,244)">
        <circle r="20" fill="#fff" stroke="#1f7a45" stroke-width="2.5"/>
        <path d="M-7 0l4.5 4.5 10-10" fill="none" stroke="#1f7a45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g transform="translate(16,286)">
        <rect width="230" height="58" rx="10" fill="#fbeeeb"/>
        <text x="14" y="24" font-size="14" font-weight="700" fill="#c4321f">Blocked for security</text>
        <text x="14" y="43" font-size="12" fill="#7a2214">Hosts close these ports to stop spam</text>
      </g>

      <!-- providers -->
      <path d="M306 372C306 400 216 392 216 420" fill="none" stroke="#1f7a45" stroke-width="3.5" marker-end="url(#arrow-gm)"/>
      <path d="M306 372V420" fill="none" stroke="#1f7a45" stroke-width="3.5" marker-end="url(#arrow-gm)" opacity="0"/>
      <g filter="url(#shadow-m)">
        <rect x="56" y="428" width="150" height="52" rx="12" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/>
        <rect x="226" y="428" width="150" height="52" rx="12" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/>
      </g>
      <g transform="translate(72,443)">{{icon:sendgrid:1a82e2:22}}</g>
      <text x="104" y="460" font-size="16" font-weight="700" fill="#16161a">SendGrid</text>
      <g transform="translate(242,443)">{{icon:brevo:0b996e:22}}</g>
      <text x="274" y="460" font-size="16" font-weight="700" fill="#16161a">Brevo</text>

      <path d="M131 480C131 510 216 500 216 524M301 480C301 510 216 500 216 524" fill="none" stroke="#b9b9b2" stroke-width="2.5"/>
      <g filter="url(#shadow-m)"><rect x="180" y="526" width="72" height="56" rx="12" fill="#fff" stroke="#d6d6d0" stroke-width="1.5"/></g>
      <g transform="translate(199,538)" fill="none" stroke="#16161a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="3" width="34" height="24" rx="4"/><path d="M0 7l17 11 17-11"/>
      </g>
      <text x="266" y="560" font-size="13" font-weight="600" fill="#1f7a45">delivered</text>
    </svg>
  </div>

  <div class="foot">
    <div class="pill"><span>$</span> composer require lmottasin/laravel-http-mailer</div>
    <div class="nochange"><i>✓</i> No changes to your email code</div>
  </div>
</body>
</html>
