<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(900px 500px at 85% 20%, rgba(26,130,226,.30), transparent 60%),
      radial-gradient(700px 500px at 75% 95%, rgba(11,153,110,.28), transparent 60%),
      radial-gradient(600px 400px at 10% 10%, rgba(255,45,32,.22), transparent 60%),
      linear-gradient(135deg, #0b1020 0%, #111833 55%, #0a1a24 100%);
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at 70% 50%, #000 20%, transparent 75%);
  }

  /* ---------- copy ---------- */
  .copy { position: absolute; left: 72px; top: 88px; width: 560px; z-index: 5; }
  .pill {
    display: inline-flex; gap: 8px; align-items: center;
    font: 600 15px Inter; letter-spacing: .02em;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
  }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }
  h1 { font-size: 68px; font-weight: 800; line-height: 1.02; margin-top: 26px; letter-spacing: -.03em; }
  h1 span { background: linear-gradient(90deg, #ff6a5c, #ff2d20); -webkit-background-clip: text; color: transparent; }
  .sub { margin-top: 22px; font-size: 24px; line-height: 1.4; color: #c9d2e8; font-weight: 500; }
  .sub b { color: #fff; }
  .code {
    margin-top: 34px; display: inline-block;
    font: 700 22px "JetBrains Mono", monospace;
    padding: 16px 22px; border-radius: 14px;
    background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 40px rgba(0,0,0,.4);
  }
  .code .k { color: #7dd3fc; } .code .v { color: #86efac; } .code .c { color: #64748b; font-weight: 500; }
  .composer { margin-top: 18px; font: 500 17px "JetBrains Mono", monospace; color: #94a3b8; }

  /* ---------- 3D scene ---------- */
  .scene { position: absolute; left: 640px; top: 0; width: 640px; height: 640px; perspective: 1800px; }
  .plane {
    position: absolute; left: 150px; top: 120px; width: 380px; height: 380px;
    transform-style: preserve-3d;
    transform: translate(-60px, 10px) rotateX(58deg) rotateZ(-42deg) scale(.86);
  }
  .floor {
    position: absolute; inset: -40px; border-radius: 28px;
    background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 0 80px rgba(26,130,226,.25) inset;
  }
  .block { position: absolute; transform-style: preserve-3d; }
  .block .top, .block .front, .block .right { position: absolute; }
  .block .top {
    inset: 0; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
  }
  .block .front { left: 0; top: 100%; width: 100%; transform-origin: top; }
  .block .right { top: 0; left: 100%; height: 100%; transform-origin: left; }
  .top svg { filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  .label { font: 800 18px Inter; letter-spacing: .01em; text-shadow: 0 2px 6px rgba(0,0,0,.4); }

  /* path beams lying on the floor */
  .beam { position: absolute; height: 10px; border-radius: 10px; transform-origin: left center; }
  .beam.ok {
    background: repeating-linear-gradient(90deg, #22c55e 0 18px, rgba(34,197,94,.25) 18px 30px);
    box-shadow: 0 0 18px rgba(34,197,94,.9);
  }
  .beam.bad {
    background: repeating-linear-gradient(90deg, #ef4444 0 10px, transparent 10px 20px);
    opacity: .9;
  }

  /* flat 2D overlays (not rotated) */
  .tag {
    position: absolute; z-index: 6;
    font: 700 15px "JetBrains Mono", monospace;
    padding: 8px 12px; border-radius: 10px; white-space: nowrap;
    box-shadow: 0 10px 24px rgba(0,0,0,.45);
  }
  .tag.ok { background: #052e1a; color: #86efac; border: 1px solid #22c55e; }
  .tag.bad { background: #2a0a0a; color: #fca5a5; border: 1px solid #ef4444; }
</style>
</head>
<body>
<div class="grid"></div>

<div class="copy">
  <div class="pill"><i></i>Laravel 11 · 12 · 13 &nbsp;·&nbsp; PHP 8.2+</div>
  <h1>Laravel<br><span>HTTP Mailer</span></h1>
  <p class="sub">SMTP blocked on your server?<br>Send mail over <b>HTTPS</b> with <b>SendGrid</b> &amp; <b>Brevo</b>.<br>No code changes.</p>
  <div class="code"><span class="k">MAIL_MAILER</span>=<span class="v">sendgrid</span> <span class="c"># or brevo</span></div>
  <div class="composer">composer require lmottasin/laravel-http-mailer</div>
</div>

<div class="scene">
  <div class="plane" id="plane">
    <div class="floor"></div>
  </div>
  <div class="tag ok" style="left:300px; top:150px;">HTTPS :443 ✓</div>
  <div class="tag bad" style="left:440px; top:380px;">SMTP :587 ✕</div>
</div>

<script>
const ICONS = {
  laravel: "M23.642 5.43a.364.364 0 01.014.1v5.149c0 .135-.073.26-.189.326l-4.323 2.49v4.934a.378.378 0 01-.188.326L9.93 23.949a.316.316 0 01-.066.027c-.008.002-.016.008-.024.01a.348.348 0 01-.192 0c-.011-.002-.02-.008-.03-.012-.02-.008-.042-.014-.062-.025L.533 18.755a.376.376 0 01-.189-.326V2.974c0-.033.005-.066.014-.098.003-.012.01-.02.014-.032a.369.369 0 01.023-.058c.004-.013.015-.022.023-.033l.033-.045c.012-.01.025-.018.037-.027.014-.012.027-.024.041-.034H.53L5.043.05a.375.375 0 01.375 0L9.930 2.647h.002c.015.01.027.021.04.033l.038.027c.013.014.02.03.033.045.008.011.02.021.025.033.01.02.017.038.024.058.003.011.01.021.013.032.01.031.014.064.014.098v9.652l3.76-2.164V5.527c0-.033.004-.066.013-.098.003-.01.01-.02.013-.032a.487.487 0 01.024-.059c.007-.012.018-.02.025-.033.012-.015.021-.03.033-.043.012-.012.025-.02.037-.028.014-.01.026-.023.041-.032h.001l4.513-2.598a.375.375 0 01.375 0l4.513 2.598c.016.01.027.021.042.031.012.01.025.018.036.028.013.014.022.03.034.044.008.012.019.021.024.033.011.02.018.04.024.06.006.01.012.021.015.032zm-.74 5.032V6.179l-1.578.908-2.182 1.256v4.283zm-4.51 7.75v-4.287l-2.147 1.225-6.126 3.498v4.325zM1.093 3.624v14.588l8.273 4.761v-4.325l-4.322-2.445-.002-.003H5.04c-.014-.01-.025-.021-.04-.031-.011-.01-.024-.018-.035-.027l-.001-.002c-.013-.012-.021-.025-.031-.04-.01-.011-.021-.022-.028-.036h-.002c-.008-.014-.013-.031-.02-.047-.006-.016-.014-.027-.018-.043a.49.49 0 01-.008-.057c-.002-.014-.006-.027-.006-.041V5.789l-2.18-1.257zM5.23.81L1.47 2.974l3.76 2.164 3.758-2.164zm1.956 13.505l2.182-1.256V3.624l-1.58.91-2.182 1.255v9.435zm11.581-10.95l-3.76 2.163 3.76 2.163 3.759-2.164zm-.376 4.978L16.21 7.087 14.63 6.18v4.283l2.182 1.256 1.58.908zm-8.65 9.654l5.514-3.148 2.756-1.572-3.757-2.163-4.323 2.489-3.941 2.27z",
  sendgrid: "M.8 24h13.6c.88 0 1.6-.72 1.6-1.6v-4.8c0-.88-.72-1.6-1.6-1.6H9.6c-.88 0-1.6-.72-1.6-1.6V9.6C8 8.72 7.28 8 6.4 8H1.6C.72 8 0 8.72 0 9.6v13.6c0 .44.36.8.8.8zM23.2 0H9.6C8.72 0 8 .72 8 1.6v4.8C8 7.28 8.72 8 9.6 8h4.8c.88 0 1.6.72 1.6 1.6v4.8c0 .88.72 1.6 1.6 1.6h4.8c.88 0 1.6-.72 1.6-1.6V.8c0-.44-.36-.8-.8-.8Z",

  mail: "M2 5h20v14H2z M2 5l10 8 10-8",
};

const plane = document.getElementById('plane');

function block({ x, y, w, d, h, top, side, front, icon, iconColor = '#fff', label, size = 56 }) {
  const b = document.createElement('div');
  b.className = 'block';
  Object.assign(b.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: d + 'px', transform: `translateZ(0px)` });
  b.innerHTML = `
    <div class="front" style="height:${h}px; background:${front}; transform: translateZ(${h}px) rotateX(-90deg); border-radius:0 0 12px 12px"></div>
    <div class="right" style="width:${h}px; background:${side}; transform: translateZ(${h}px) rotateY(90deg); border-radius:0 12px 12px 0"></div>
    <div class="top" style="background:${top}; transform: translateZ(${h}px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), inset 0 8px 24px rgba(255,255,255,.18)">
      ${icon ? `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path fill="${iconColor}" d="${ICONS[icon]}"/></svg>` : ''}
      ${label ? `<div class="label">${label}</div>` : ''}
    </div>`;
  plane.appendChild(b);
}

function beam(x, y, len, angle, kind) {
  const el = document.createElement('div');
  el.className = 'beam ' + kind;
  Object.assign(el.style, { left: x + 'px', top: y + 'px', width: len + 'px', transform: `translateZ(2px) rotate(${angle}deg)` });
  plane.appendChild(el);
}

/* beams first so blocks sit on top */
beam(150, 95, 170, -2, 'ok');     // Laravel -> SendGrid
beam(100, 170, 165, 88, 'ok');    // Laravel -> Brevo
beam(170, 170, 230, 45, 'bad');   // Laravel -> blocked SMTP

/* Laravel app */
block({ x: 20, y: 20, w: 150, d: 150, h: 60,
  top: 'linear-gradient(135deg,#ff5a4e,#e0241a)', front: '#a3170f', side: '#c21d14',
  icon: 'laravel', label: 'Laravel', size: 60 });

/* SendGrid */
block({ x: 250, y: 30, w: 120, d: 120, h: 44,
  top: 'linear-gradient(135deg,#3aa0ff,#1a6fd0)', front: '#0f4c94', side: '#145db3',
  icon: 'sendgrid', label: 'SendGrid', size: 46 });

/* Brevo */
block({ x: 35, y: 250, w: 120, d: 120, h: 44,
  top: 'linear-gradient(135deg,#19c08d,#0b8a62)', front: '#065c41', side: '#087352',
  icon: 'brevo', label: 'Brevo', size: 46 });

/* blocked SMTP wall */
block({ x: 300, y: 300, w: 70, d: 70, h: 18,
  top: 'repeating-linear-gradient(45deg,#3b1212 0 8px,#5c1a1a 8px 16px)', front: '#2a0a0a', side: '#3a0e0e',
  label: '✕' });
</script>
</body>
</html>
